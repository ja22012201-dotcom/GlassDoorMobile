name: Build APK (Android Final)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Spec
        run: |
          cat <<EOT > buildozer.spec
          [app]
          title = GlassDoorApp
          package.name = glassdoor
          package.domain = org.glassdoor
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0
          
          # Versiones estables fijadas para evitar betas experimentales
          requirements = python3==3.10.14,kivy==2.2.1,kivymd==1.2.0,pillow==10.2.0,reportlab,android
          
          icon.filename = icon.png
          presplash.filename = icon.png
          orientation = portrait
          fullscreen = 0 
          
          android.permissions = WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          android.presplash_color = #FFFFFF
          
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOT

      # Acción oficial de la comunidad Kivy (Gestiona dependencias y cachés de forma automática)
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: master

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassDoorApp-v1.0
          path: ${{ steps.buildozer.outputs.filename }}
