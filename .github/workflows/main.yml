name: Build APK (Android Final)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Usamos el entorno aislado oficial creado por el equipo de Kivy
    container:
      image: kivy/buildozer:latest

    steps:
      # 1. Obtener el código del repositorio
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Asegurar que exista icon.png incluso si se subió con otro nombre
      - name: Prepare Icon File
        run: |
          if [ ! -f "icon.png" ]; then
            echo "Buscando archivos de logo alternativos..."
            if [ -f "logo silver.png" ]; then
              cp "logo silver.png" icon.png
            elif [ -f "logo_silver.png" ]; then
              cp "logo_silver.png" icon.png
            fi
          fi

      # 3. Crear archivo buildozer.spec optimizado
      - name: Create Buildozer Spec
        run: |
          rm -f buildozer.spec
          cat <<EOT >> buildozer.spec
          [app]
          # --- DATOS BÁSICOS ---
          title = GlassDoorApp
          package.name = glassdoor
          package.domain = org.glassdoor
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0
          
          # --- REQUISITOS ---
          requirements = python3,kivy==2.2.1,kivymd==1.2.0,pillow,reportlab,android
          
          # --- IMAGEN CORPORATIVA ---
          icon.filename = icon.png
          presplash.filename = icon.png
          
          # --- PANTALLA ---
          orientation = portrait
          fullscreen = 0 
          
          # --- PERMISOS ANDROID ---
          android.permissions = WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          
          # --- CONFIGURACIÓN TÉCNICA ---
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          
          # Fondo blanco para la pantalla de carga
          android.presplash_color = #FFFFFF
          
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOT

      # 4. Compilar el APK dentro del contenedor
      - name: Build APK with Buildozer
        run: |
          buildozer -y android debug

      # 5. Guardar el archivo APK resultante
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassDoorApp-v1.0
          path: bin/*.apk
