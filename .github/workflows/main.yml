name: Build APK (Android Final)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Obtener el código fuente de la app
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar Python 3.10
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Instalar librerías nativas del sistema
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev ant python3-dev curl git

      # 5. Instalar Buildozer y Cython
      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip setuptools
          pip install cython==0.29.33
          pip install buildozer==1.5.0

      # 6. Clonar python-for-android y parchear Freetype con Regex + Caché
      - name: Clone p4a and Patch Freetype
        run: |
          rm -rf p4a
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git p4a
          
          # Parchear la URL mediante Expresión Regular
          python3 -c "
          import re
          recipe_path = 'p4a/pythonforandroid/recipes/freetype/__init__.py'
          with open(recipe_path, 'r') as f:
              code = f.read()
          code = re.sub(r'url\s*=\s*[\'\"][^\'\"]+[\'\"]', 'url = \'https://downloads.sourceforge.net/project/freetype/freetype2/{version}/freetype-{version}.tar.gz\'', code)
          with open(recipe_path, 'w') as f:
              f.write(code)
          print('✅ Receta de Freetype parcheada correctamente con Regex.')
          "

          # Posicionar el paquete en las rutas de almacenamiento local
          mkdir -p p4a/packages/freetype
          mkdir -p ~/.local/share/python-for-android/packages/freetype
          mkdir -p .buildozer/android/platform/build-arm64-v8a/packages/freetype

          curl -L -o freetype-2.14.1.tar.gz https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz
          cp freetype-2.14.1.tar.gz p4a/packages/freetype/
          cp freetype-2.14.1.tar.gz ~/.local/share/python-for-android/packages/freetype/
          cp freetype-2.14.1.tar.gz .buildozer/android/platform/build-arm64-v8a/packages/freetype/

      # 7. Crear buildozer.spec
      - name: Create Spec
        run: |
          rm -f buildozer.spec
          cat <<EOT > buildozer.spec
          [app]
          title = GlassDoorApp
          package.name = glassdoor
          package.domain = org.glassdoor
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0
          
          requirements = python3,kivy==2.2.1,kivymd==1.2.0,pillow,reportlab,android
          
          icon.filename = icon.png
          presplash.filename = icon.png
          orientation = portrait
          fullscreen = 0 
          
          android.permissions = WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          android.presplash_color = #FFFFFF
          
          p4a.source_dir = ./p4a
          
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOT

      # 8. Compilar APK con extracción de logs detallada en caso de fallo
      - name: Build APK
        run: |
          buildozer -y android debug || {
            echo "=========================================="
            echo "REGISTROS DETALLADOS DEL ERROR DE COMPILACIÓN:"
            echo "=========================================="
            find .buildozer/ -name "*.log" -exec tail -n 40 {} + 2>/dev/null
            exit 1
          }

      # 9. Subir el ejecutable APK final
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassDoorApp-v1.0
          path: bin/*.apk
