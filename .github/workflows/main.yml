name: Build APK (Android Final)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar Python 3.10
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Instalar dependencias base del sistema Linux
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev ant python3-dev curl

      # 5. Instalar versión estable de Buildozer y Cython
      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools
          pip install cython==0.29.33
          pip install buildozer==1.5.0

      # 6. Generar archivo buildozer.spec con requisitos estándar
      - name: Create Spec
        run: |
          rm -rf buildozer.spec
          cat <<EOT > buildozer.spec
          [app]
          title = GlassDoorApp
          package.name = glassdoor
          package.domain = org.glassdoor
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0
          
          requirements = python3,kivy==2.2.1,kivymd==1.2.0,pillow,reportlab,android
          
          icon.filename = icon.png
          presplash.filename = icon.png
          orientation = portrait
          fullscreen = 0 
          
          android.permissions = WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          android.presplash_color = #FFFFFF
          
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOT

      # 7. Localizar y parchear automáticamente la URL de Freetype en cualquier receta
      - name: Patch Freetype URL & Pre-download
        run: |
          buildozer android p4a -- --help || true

          python3 -c "
          import os, glob
          search_paths = [
              '.buildozer/**/*.py',
              '/opt/hostedtoolcache/**/*.py'
          ]
          for pattern in search_paths:
              for filepath in glob.glob(pattern, recursive=True):
                  if filepath.endswith('recipes/freetype/__init__.py'):
                      try:
                          with open(filepath, 'r') as f:
                              content = f.read()
                          if 'savannah.gnu.org' in content:
                              content = content.replace('download.savannah.gnu.org/releases/freetype', 'downloads.sourceforge.net/project/freetype/freetype2/{version}')
                              with open(filepath, 'w') as f:
                                  f.write(content)
                              print(f'✅ Parcheado con éxito: {filepath}')
                      except Exception as e:
                          print(f'Error al modificar {filepath}: {e}')
          "

          mkdir -p ~/.buildozer/android/packages/freetype
          mkdir -p .buildozer/android/platform/build-arm64-v8a/packages/freetype
          curl -L -o ~/.buildozer/android/packages/freetype/freetype-2.14.1.tar.gz https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz
          cp ~/.buildozer/android/packages/freetype/freetype-2.14.1.tar.gz .buildozer/android/platform/build-arm64-v8a/packages/freetype/ 2>/dev/null || true

      # 8. Ejecutar la compilación del APK
      - name: Build APK
        run: |
          buildozer -y android debug

      # 9. Subir el paquete APK generado
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassDoorApp-v1.0
          path: bin/*.apk
