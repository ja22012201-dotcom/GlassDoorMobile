name: Build APK (Android Final)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Obtener el código fuente de la app
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar Python 3.10
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Instalar dependencias nativas del sistema operativo
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev ant python3-dev curl git

      # 5. Instalar Buildozer y Cython
      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip setuptools
          pip install cython==0.29.33
          pip install buildozer==1.5.0

      # 6. Clonar python-for-android estable (v2024.01.21) y parchear Freetype
      - name: Clone p4a and Patch Freetype
        run: |
          rm -rf p4a
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git p4a
          
          python3 -c "
          recipe_path = 'p4a/pythonforandroid/recipes/freetype/__init__.py'
          with open(recipe_path, 'r') as f:
              content = f.read()
          content = content.replace('download.savannah.gnu.org/releases/freetype', 'downloads.sourceforge.net/project/freetype/freetype2/{version}')
          with open(recipe_path, 'w') as f:
              f.write(content)
          print('✅ Receta de Freetype parcheada en p4a local.')
          "

      # 7. Crear buildozer.spec vinculando p4a.source_dir
      - name: Create Spec
        run: |
          rm -f buildozer.spec
          cat <<EOT > buildozer.spec
          [app]
          title = GlassDoorApp
          package.name = glassdoor
          package.domain = org.glassdoor
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0
          
          requirements = python3,kivy==2.2.1,kivymd==1.2.0,pillow,reportlab,android
          
          icon.filename = icon.png
          presplash.filename = icon.png
          orientation = portrait
          fullscreen = 0 
          
          android.permissions = WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          android.presplash_color = #FFFFFF
          
          # Indicar a Buildozer que use la copia local parcheada
          p4a.source_dir = ./p4a
          
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOT

      # 8. Compilar el APK
      - name: Build APK
        run: |
          buildozer -y android debug

      # 9. Subir el ejecutable APK resultante
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassDoorApp-v1.0
          path: bin/*.apk
