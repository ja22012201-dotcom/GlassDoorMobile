name: Build APK (Android Final)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Bajar el código
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar Python 3.10
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Instalar dependencias del sistema operativo
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev ant python3-dev

      # 5. Instalar Buildozer y Cython
      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools
          pip install cython==0.29.33
          pip install buildozer
          pip install git+https://github.com/kivy/python-for-android.git@master

      # 6. Crear buildozer.spec (ATENCIÓN: Ya no borramos la caché para no perder progreso)
      - name: Create Spec
        run: |
          rm -f buildozer.spec
          
          cat <<EOT >> buildozer.spec
          [app]
          title = GlassDoorApp
          package.name = glassdoor
          package.domain = org.glassdoor
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0
          
          requirements = python3,kivy==2.2.1,kivymd==1.2.0,pillow,reportlab,android
          
          icon.filename = icon.png
          presplash.filename = icon.png
          
          orientation = portrait
          fullscreen = 0 
          
          android.permissions = WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          
          android.presplash_color = #FFFFFF
          
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOT

      # 7. Compilar la aplicación (CON BUCLE CABEZOTA)
      - name: Build APK (Auto-Retry)
        run: |
          # El sistema intentará compilar hasta 10 veces seguidas si detecta caída de red.
          for i in {1..10}; do
            echo "========================================"
            echo "INTENTO DE COMPILACIÓN NÚMERO $i..."
            echo "========================================"
            
            # Si buildozer tiene éxito, salimos del bucle (exit 0)
            buildozer -y android debug && exit 0
            
            echo "⚠️ Fallo detectado (posible caída de servidor 502)."
            echo "Esperando 15 segundos antes de reanudar la descarga..."
            sleep 15
          done
          
          echo "❌ La compilación falló después de 10 intentos por culpa de la red."
          exit 1

      # 8. Subir el archivo APK resultante
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassDoorApp-v1.0
          path: bin/*.apk
