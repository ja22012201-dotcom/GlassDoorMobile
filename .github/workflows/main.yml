name: Build APK (Android Final)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Bajar el código
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar Python 3.10
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Instalar dependencias del sistema operativo
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev ant python3-dev

      # 5. Instalar Buildozer
      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip setuptools
          pip install cython==0.29.33
          pip install buildozer

      # 6. Crear buildozer.spec
      - name: Create Spec
        run: |
          rm -rf .buildozer ~/.buildozer buildozer.spec
          
          cat <<EOT >> buildozer.spec
          [app]
          title = GlassDoorApp
          package.name = glassdoor
          package.domain = org.glassdoor
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0
          
          requirements = python3,kivy==2.2.1,kivymd==1.2.0,pillow,reportlab,android
          
          icon.filename = icon.png
          presplash.filename = icon.png
          
          orientation = portrait
          fullscreen = 0 
          
          android.permissions = WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          
          android.presplash_color = #FFFFFF
          
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOT

      # 7. INYECCIÓN DEL PARCHE EN EL NÚCLEO DE BUILDOZER
      - name: Initialize Buildozer and Patch Freetype URL
        run: |
          echo "Inicializando el motor de Buildozer..."
          # Al pedirle la ayuda, forzamos a Buildozer a instalar python-for-android en la carpeta oculta
          buildozer android p4a -- --help || true
          
          echo "Buscando la receta defectuosa de Freetype..."
          RECIPE_FILE=".buildozer/android/platform/python-for-android/pythonforandroid/recipes/freetype/__init__.py"
          
          if [ -f "$RECIPE_FILE" ]; then
            echo "¡Archivo encontrado! Reemplazando el servidor caído (GNU Savannah) por SourceForge..."
            sed -i 's|download.savannah.gnu.org/releases/freetype|downloads.sourceforge.net/project/freetype/freetype2/{version}|g' "$RECIPE_FILE"
            echo "✅ Parche aplicado con éxito."
          else
            echo "❌ No se encontró el archivo de la receta."
          fi

      # 8. Compilar la aplicación
      - name: Build APK
        run: |
          buildozer -y android debug

      # 9. Subir el archivo APK resultante
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassDoorApp-v1.0
          path: bin/*.apk
