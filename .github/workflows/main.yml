name: Build APK (Android Final)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Descargar el código fuente
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Preparar Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Preparar Python 3.10
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Instalar dependencias base de Linux
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev ant python3-dev curl

      # 5. Instalar Buildozer
      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools
          pip install cython==0.29.33
          pip install buildozer==1.5.0

      # 6. Crear archivo buildozer.spec emparejando hostpython3 y python3
      - name: Create Spec
        run: |
          rm -rf buildozer.spec
          cat <<EOT > buildozer.spec
          [app]
          title = GlassDoorApp
          package.name = glassdoor
          package.domain = org.glassdoor
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0
          
          # Emparejamos hostpython3 y python3 a la versión estable 3.11.5
          requirements = hostpython3==3.11.5,python3==3.11.5,kivy==2.2.1,kivymd==1.2.0,pillow==10.2.0,reportlab,android
          
          icon.filename = icon.png
          presplash.filename = icon.png
          orientation = portrait
          fullscreen = 0 
          
          android.permissions = WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          android.presplash_color = #FFFFFF
          
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOT

      # 7. Parchear la ruta de Freetype
      - name: Pre-download Freetype and Patch Local Recipe
        run: |
          buildozer android p4a -- --help || true

          RECIPE=".buildozer/android/platform/python-for-android/pythonforandroid/recipes/freetype/__init__.py"
          if [ -f "$RECIPE" ]; then
            sed -i 's|download.savannah.gnu.org/releases/freetype|downloads.sourceforge.net/project/freetype/freetype2/{version}|g' "$RECIPE"
          fi

          mkdir -p .buildozer/android/platform/build-arm64-v8a/packages/freetype
          curl -L -o .buildozer/android/platform/build-arm64-v8a/packages/freetype/freetype-2.14.1.tar.gz https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz

      # 8. Compilar la APK
      - name: Build APK
        run: |
          buildozer -y android debug

      # 9. Subir el artefacto APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassDoorApp-v1.0
          path: bin/*.apk
