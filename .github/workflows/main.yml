name: Build APK (Android Final)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # VOLVEMOS A LA CÁMARA ACORAZADA ESTABLE (Kivy Docker)
    container:
      image: kivy/buildozer:latest

    steps:
      # 1. Bajar el código
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. HACKEO DESDE DENTRO DEL CONTENEDOR (Adiós Savannah 502)
      - name: Hack Freetype in Docker
        run: |
          echo "Buscando las herramientas de Android en el contenedor estable..."
          P4A_DIR=$(/home/user/.venv/bin/python3 -c "import pythonforandroid; print(pythonforandroid.__path__[0])")
          echo "Ruta encontrada: $P4A_DIR"
          
          echo "Reemplazando el servidor roto (GNU Savannah) por SourceForge..."
          sed -i 's|download.savannah.gnu.org/releases/freetype|downloads.sourceforge.net/project/freetype/freetype2/{version}|g' "$P4A_DIR/recipes/freetype/__init__.py"
          echo "✅ Parche inyectado. Buildozer ya no se atascará en Freetype."

      # 3. Crear Spec estandarizado
      - name: Create Spec
        run: |
          rm -f buildozer.spec
          
          cat <<EOT >> buildozer.spec
          [app]
          title = GlassDoorApp
          package.name = glassdoor
          package.domain = org.glassdoor
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0
          
          requirements = python3,kivy==2.2.1,kivymd==1.2.0,pillow,reportlab,android
          
          icon.filename = icon.png
          presplash.filename = icon.png
          
          orientation = portrait
          fullscreen = 0 
          
          android.permissions = WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          
          android.presplash_color = #FFFFFF
          
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOT

      # 4. Compilar (Con versiones estables, sin Python 3.14)
      - name: Build APK
        run: |
          buildozer -y android debug

      # 5. Guardar APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassDoorApp-v1.0
          path: bin/*.apk
